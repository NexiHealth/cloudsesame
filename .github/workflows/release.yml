name: Release

# Push a tag like v1.2.3 to release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Binaries -> GitHub Release, Homebrew tap, Scoop bucket (winget PR disabled in .goreleaser.yaml).
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to NexiHealth/homebrew-tap, NexiHealth/scoop-bucket and NexiHealth/winget-pkgs.
          PACKAGES_GITHUB_TOKEN: ${{ secrets.PACKAGES_GITHUB_TOKEN }}
          WINGET_ENABLED: ${{ vars.WINGET_ENABLED }}

  # JS bundle -> npm (bunx cloudsesame / npx cloudsesame).
  npm:
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC, no token) needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      # Authenticates through the trusted publisher configured on npmjs.com (NexiHealth/cloudsesame, release.yml).
      - run: npm publish --provenance --access public

  # Release zip -> Chocolatey. Needs choco, hence Windows. Skipped until CHOCOLATEY_API_KEY is set.
  chocolatey:
    runs-on: windows-latest
    needs: goreleaser
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        if: env.CHOCOLATEY_API_KEY != ''
      - name: Pack and push
        if: env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          $zip = "cloudsesame_${version}_windows_amd64.zip"
          gh release download $env:GITHUB_REF_NAME --pattern checksums.txt
          $sha = ((Get-Content checksums.txt | Select-String " $zip$").Line -split '\s+')[0]
          if (-not $sha) { throw "No checksum for $zip" }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$zip"
          $install = 'packaging/chocolatey/tools/chocolateyinstall.ps1'
          (Get-Content $install) -replace '__URL__', $url -replace '__SHA256__', $sha | Set-Content $install
          choco pack packaging/chocolatey/cloudsesame.nuspec --version $version --outputdirectory .
          choco push "cloudsesame.$version.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
