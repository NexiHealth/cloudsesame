<svg xmlns="http://www.w3.org/2000/svg" width="720" height="328" viewBox="0 0 720 328" role="img" aria-label="cloudsesame finds an expired gcloud login and offers to log in">
<style>text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;white-space:pre}</style>
<rect width="720" height="328" rx="10" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="719" height="327" rx="10" fill="none" stroke="#30363d"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<text x="360" y="25" fill="#7d8590" text-anchor="middle" style="font-size:12px">~/acme/infra</text>
<text x="24" y="60" xml:space="preserve"><tspan fill="#7d8590">$ </tspan><tspan fill="#e6edf3" font-weight="bold">bunx cloudsesame infra</tspan></text>
<text x="24" y="82" xml:space="preserve"><tspan fill="#3fb950">✔</tspan><tspan fill="#e6edf3"> online</tspan></text>
<text x="24" y="104" xml:space="preserve"><tspan fill="#f85149">✖</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="bold">gcloud</tspan><tspan fill="#e6edf3"> user</tspan><tspan fill="#7d8590">  me@acme.dev</tspan><tspan fill="#f85149">  reauthentication required</tspan></text>
<text x="24" y="126" xml:space="preserve"><tspan fill="#7d8590">  → gcloud auth login --update-adc</tspan></text>
<text x="24" y="148" xml:space="preserve"><tspan fill="#3fb950">✔</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="bold">gcloud</tspan><tspan fill="#e6edf3"> adc</tspan></text>
<text x="24" y="170" xml:space="preserve"><tspan fill="#3fb950">✔</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="bold">gcloud</tspan><tspan fill="#e6edf3"> quota project</tspan><tspan fill="#7d8590">  acme-billing</tspan></text>
<text x="24" y="192" xml:space="preserve"><tspan fill="#3fb950">✔</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="bold">aws</tspan><tspan fill="#e6edf3"> prod</tspan><tspan fill="#7d8590">  arn:aws:sts::123456789012:assumed-role/Admin/me</tspan></text>
<text x="24" y="236" xml:space="preserve"><tspan fill="#39c5cf">?</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="bold">gcloud isn&#x27;t ready.</tspan></text>
<text x="24" y="258" xml:space="preserve"><tspan fill="#39c5cf">❯</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="bold">Log in</tspan><tspan fill="#7d8590"> (l)</tspan><tspan fill="#7d8590">  gcloud auth login --update-adc</tspan></text>
<text x="24" y="280" xml:space="preserve"><tspan fill="#e6edf3">  Skip</tspan><tspan fill="#7d8590"> (s)</tspan></text>
<text x="24" y="302" xml:space="preserve"><tspan fill="#e6edf3">  Stop</tspan><tspan fill="#7d8590"> (x)</tspan></text>
</svg>
