# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Builds standalone Bun binaries and publishes them to GitHub Releases,
# Homebrew (tap), Scoop (bucket) and winget (PR to microsoft/winget-pkgs).
# Chocolatey is handled by a separate Windows job (see .github/workflows/release.yml),
# and the JS package on npm is published with `npm publish`.
#
# Try locally: bun run release:snapshot   (artifacts land in ./dist-release)
version: 2

project_name: cloudsesame
dist: dist-release

before:
  hooks:
    - bun install --frozen-lockfile
    - bun test

builds:
  - id: cloudsesame
    builder: bun
    binary: cloudsesame
    main: ./src/cli.ts
    flags:
      - --compile
      - --minify
      - --define=__VERSION__="{{ .Version }}"
    targets:
      - linux-x64-modern
      - linux-arm64
      - darwin-x64
      - darwin-arm64
      - windows-x64-modern

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: NexiHealth
    name: cloudsesame

# brew install NexiHealth/tap/cloudsesame
homebrew_casks:
  - name: cloudsesame
    binaries: [cloudsesame]
    homepage: https://github.com/NexiHealth/cloudsesame
    description: cloudsesame CLI
    license: Apache-2.0
    repository:
      owner: NexiHealth
      name: homebrew-tap
      token: "{{ .Env.PACKAGES_GITHUB_TOKEN }}"
    # Binaries aren't notarized yet, so strip quarantine to avoid the "damaged app" dialog.
    # Replace with proper codesigning + notarization when an Apple Developer account is available.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cloudsesame"]
          end

# scoop bucket add NexiHealth https://github.com/NexiHealth/scoop-bucket && scoop install cloudsesame
scoops:
  - name: cloudsesame
    directory: bucket
    homepage: https://github.com/NexiHealth/cloudsesame
    description: cloudsesame CLI
    license: Apache-2.0
    repository:
      owner: NexiHealth
      name: scoop-bucket
      token: "{{ .Env.PACKAGES_GITHUB_TOKEN }}"

# winget install NexiHealth.cloudsesame
# Pushes manifests to a fork (NexiHealth/winget-pkgs) and opens a PR to microsoft/winget-pkgs.
# The very first submission is reviewed manually by the winget team.
winget:
  - name: cloudsesame
    publisher: NexiHealth
    author: Pol Vallverdu
    package_identifier: NexiHealth.cloudsesame
    short_description: cloudsesame CLI
    homepage: https://github.com/NexiHealth/cloudsesame
    license: Apache-2.0
    # Disabled for now. To enable: fork microsoft/winget-pkgs to NexiHealth/winget-pkgs, replace with
    # '{{ if index .Env "WINGET_ENABLED" }}false{{ else }}true{{ end }}', set the WINGET_ENABLED repo variable,
    # and restore the winget lines commented out in README.md, docs/index.md and docs/guide/installation.md.
    skip_upload: true
    repository:
      owner: NexiHealth
      name: winget-pkgs
      token: "{{ .Env.PACKAGES_GITHUB_TOKEN }}"
      branch: "cloudsesame-{{ .Version }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
